<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My Portfolio</title>

        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="styles/nav-bar.css">
        <link rel="stylesheet" href="styles/contact.css">

        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    </head>
    <body>
        <nav class="nav-bar">
            <div class="logo">Lahiru Devinda</div>
                <div class="menu-section">
                    <div class="menu">
                    <a class="links " href="index.html">Home</a>
                    <a class="links" href="about.html">About</a>
                    <a class="links" href="project.html">projects</a>
                    <a class="links current" href="#">Contact</a>
                </div>
                <button class="theme-button js-theme-toggle"><img class="theme-image" src="images/icons/moon.svg"></button>
                <button class="menu-toggle js-menu-toggle"><img class="menu-icon" src="images/icons/icons8-menu-button.svg"></button>
            </div>
        </nav>
        
        <div class="main">

            <div class="title">
                <div class="heading">Contact</div>
                <div class="sub-heading">Feel free to reach out to me for any inquiries, collaborations, or just to say hello! I'm always open to connecting with fellow professionals and enthusiasts in the industry.</div>
            </div>

            <div class="contact-content">
                <form class="contact-form js-contact-form">
                    <div class="input-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="input-name" placeholder="Your Name">
                        <small class="error-text js-name-error"></small>
                    </div>

                    <div class="input-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input-email" placeholder="Your Email">
                        <small class="error-text js-email-error"></small>
                    </div>

                    <div class="input-field">
                        <label for="message">Message</label>
                        <textarea id="message" class="input-message" placeholder="Tell Me About Your Project..." rows="5"></textarea>
                        <small class="error-text js-message-error"></small>
                    </div>

                    <div class="form-button">
                        <button type="submit" class="send-button js-send-button">
                            <img class="sen-button-image" src="images/icons/paper-plane-tilt.svg">
                            <span class="js-button-text">Send</span>
                        </button>
                    </div>

                    <div class="form-status js-form-status"></div>
                </form>

                <div class="contact-gif">
                    <img class="contact-gif-image" src="images/gif/gif.gif">
                </div>    
            </div>

        </div>

        <script src="scripts/nav-bar.js"></script>
        <script src="scripts/theme-toggle.js"></script>
        <script src="scripts/contact-form.js"></script>
    </body>
</html>
